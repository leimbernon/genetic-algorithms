name: Examples Smoke Test

on:
  push:
    branches: [main, "milestone/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, "milestone/**"]

jobs:
  examples-smoke:
    name: smoke (${{ matrix.example }})
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example:
          - knapsack_binary
          - onemax_binary
          - onemax_extension
          - rastrigin
          - nsga2_zdt1
          - island_model
          - job_scheduling
          - niching
          - hall_of_fame_demo
          - aos_demo
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: "examples-smoke-${{ matrix.example }}"

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: Run example (smoke)
        run: cargo run --example ${{ matrix.example }} --release

      - name: sccache stats
        run: sccache --show-stats
