name: Documentation Agent

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze:
    name: "Agent 1: Analyze Changes"
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.analyze.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai requests

      - name: Run Analyst Agent
        id: analyze
        env:
          MODELS_API_KEY: ${{ secrets.MODELS_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/documentation/analyze_changes.py

      - name: Upload documentation plan
        if: steps.analyze.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: doc-plan
          path: doc-plan.json
          retention-days: 1

  write-and-review:
    name: "Agents 2 & 3: Write and Review Documentation"
    needs: analyze
    if: needs.analyze.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai requests

      - name: Download documentation plan
        uses: actions/download-artifact@v4
        with:
          name: doc-plan

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Writer Agent with Reviewer loop
        env:
          MODELS_API_KEY: ${{ secrets.MODELS_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/documentation/write_docs.py

      - name: Create documentation branch and Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          BRANCH="docs/update-from-pr-${PR_NUMBER}"

          git checkout -b "$BRANCH"
          git add docs/

          if ! git diff --cached --quiet; then
            git commit -m "docs: update documentation from PR #${PR_NUMBER}"
            git push origin "$BRANCH"
          else
            echo "No documentation changes to commit. Skipping PR creation."
            exit 0
          fi

          # Build PR body
          PR_BODY="## Automated Documentation Update
          
          This PR was automatically generated by the **Documentation Agent** after merging:
          
          > **PR #${PR_NUMBER}:** ${PR_TITLE}
          
          ### What changed
          The documentation in \`/docs\` has been created or updated to reflect the code changes from that PR.
          
          ### Review checklist
          - [ ] Documentation accurately reflects the code changes
          - [ ] Examples are correct and runnable
          - [ ] Language is clear and accessible to external developers
          - [ ] No outdated information remains
          
          ---
          *Generated automatically by the Documentation Agent workflow.*"

          # Create the pull request (retry without label if it doesn't exist)
          gh pr create \
            --title "[Documentation] update from PR #${PR_NUMBER}" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH" \
            --label "documentation" 2>/dev/null || \
          gh pr create \
            --title "[Documentation] update from PR #${PR_NUMBER}" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH"
