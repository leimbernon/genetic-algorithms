[package]
name = "genetic_algorithms"
description = "Library for solving genetic algorithm problems"
authors = ["Luis Eduardo Imbernón <imbernon@gmail.com>"]
version = "3.0.0"
edition = "2021"
rust-version = "1.81.0"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/leimbernon/rust_genetic_algorithms.git"
homepage = "https://github.com/leimbernon/rust_genetic_algorithms.git"
documentation = "https://docs.rs/genetic_algorithms/latest/genetic_algorithms"
keywords = ["genetics", "algorithm", "ai", "artificial", "intelligence"]
categories = ["emulators","development-tools", "science", "simulation"]

include = [
    "/src",
    "/examples",
    "/tests",
    "/benches",
    "/docs",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/SECURITY.md",
    "MIGRATION.md",
]

[features]
default = ["logging", "parallel"]
logging = ["dep:log"]
parallel = ["dep:rayon"]
serde = ["dep:serde", "dep:serde_json", "dep:serde_stacker"]
visualization = ["dep:plotters"]
observer-tracing = ["dep:tracing"]
observer-metrics = ["dep:metrics"]
benchmarks = []

[dependencies]
rand = "0.9.2"
rayon = { version = "1.10", optional = true }
log = { version = "0.4.22", features = ["std", "serde", "kv_unstable"], optional = true }
tracing = { version = "0.1", optional = true }
metrics = { version = "0.24", optional = true }
serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }
serde_stacker = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "line_series", "point_series", "histogram", "ttf"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "point_series", "histogram", "ab_glyph"], optional = true }

[dev-dependencies]
divan = "0.1.21"
env_logger = "0.11.5"
serde_json = { version = "1", features = ["unbounded_depth"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"

