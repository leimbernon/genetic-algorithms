[package]
name = "genetic_algorithms"
description = "Library for solving genetic algorithm problems"
authors = ["Luis Eduardo Imbernón <imbernon@gmail.com>"]
version = "2.4.0"
edition = "2021"
rust-version = "1.81.0"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/leimbernon/rust_genetic_algorithms.git"
homepage = "https://github.com/leimbernon/rust_genetic_algorithms.git"
documentation = "https://docs.rs/genetic_algorithms/latest/genetic_algorithms"
keywords = ["genetics", "algorithm", "ai", "artificial", "intelligence"]
categories = ["emulators","development-tools", "science", "simulation"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
visualization = ["dep:plotters"]
observer-tracing = ["dep:tracing"]
observer-metrics = ["dep:metrics"]
benchmarks = []

[dependencies]
rand = "0.9.2"
rayon = "1.10"
log = { version = "0.4.22", features = ["std", "serde", "kv_unstable"] }
tracing = { version = "0.1", optional = true }
metrics = { version = "0.24", optional = true }
env_logger = "0.11.5"
serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "line_series", "histogram", "ab_glyph"], optional = true }

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"

[[bench]]
name = "selection"
harness = false

[[bench]]
name = "crossover"
harness = false

[[bench]]
name = "mutation"
harness = false

[[bench]]
name = "survivor"
harness = false

[[bench]]
name = "ga_run"
harness = false

[[bench]]
name = "nsga2"
harness = false

[[bench]]
name = "island_ga"
harness = false

[[bench]]
name = "de"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "scatter"
harness = false

[[bench]]
name = "alps"
harness = false

[[bench]]
name = "cellular"
harness = false

[[bench]]
name = "metrics_observer"
harness = false
required-features = ["observer-metrics"]
